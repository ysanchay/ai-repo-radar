<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Detail — AI Repo Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo" style="text-decoration:none;color:inherit">
      <span class="logo-icon">◈</span>
      <div>
        <h1>AI Repo Radar</h1>
        <p class="tagline">Trending AI repositories</p>
      </div>
    </a>
  </div>
</header>

<main class="main-content">
  <div class="repo-detail" id="repoDetail">
    <p>Loading...</p>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-credit">Built by <a href="https://github.com/ysanchay">SanCompany</a></p>
  </div>
</footer>

<script>
const DATA_URL = '/data/repos.json';
const params = new URLSearchParams(window.location.search);
const repoId = parseInt(params.get('id'));

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n;
}

function getVelocityLabel(s) {
  if (s>=50) return 'Explosive 🚀';
  if (s>=25) return 'Hot 🔥';
  if (s>=10) return 'Warming 📈';
  return 'Steady ✨';
}

async function load() {
  try {
    const res = await fetch(DATA_URL);
    const repos = await res.json();
    const repo = repos.find(r => r.id === repoId);
    if (!repo) { document.getElementById('repoDetail').innerHTML = '<p>Repo not found. <a href="/">Back home</a></p>'; return; }
    render(repo, repos);
  } catch(e) {
    document.getElementById('repoDetail').innerHTML = '<p>Error loading data. <a href="/">Back home</a></p>';
  }
}

function render(repo, allRepos) {
  const related = allRepos.filter(r => 
    r.id !== repo.id && r.topics.some(t => repo.topics.includes(t))
  ).slice(0, 3);

  document.title = `${repo.full_name} — AI Repo Radar`;

  document.getElementById('repoDetail').innerHTML = `
    <a href="/" class="back-link">← Back to Radar</a>
    <div class="repo-detail-header">
      <h1 class="repo-detail-name">${repo.full_name.split('/')[1]}</h1>
      <div class="repo-detail-owner">by <strong>${repo.full_name.split('/')[0]}</strong></div>
      <p class="repo-detail-desc">${repo.description}</p>
    </div>

    <div class="detail-stats">
      <div class="detail-stat">
        <span class="detail-stat-label">⭐ Stars</span>
        <span class="detail-stat-value">${formatNum(repo.stars)}</span>
      </div>
      <div class="detail-stat">
        <span class="detail-stat-label">📈 This Week</span>
        <span class="detail-stat-value">+${formatNum(repo.stars_this_week)}</span>
      </div>
      <div class="detail-stat">
        <span class="detail-stat-label">🔥 Velocity</span>
        <span class="detail-stat-value">${repo.velocity_score.toFixed(1)}x ${getVelocityLabel(repo.velocity_score)}</span>
      </div>
      <div class="detail-stat">
        <span class="detail-stat-label">💻 Language</span>
        <span class="detail-stat-value">${repo.language || 'N/A'}</span>
      </div>
    </div>

    ${repo.summary ? `
    <div class="repo-detail-summary">
      <h3>🤖 AI Summary</h3>
      <p>${repo.summary}</p>
    </div>` : ''}

    ${repo.topics ? `
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:1rem 0">
      ${repo.topics.map(t => `<span class="tag">${t}</span>`).join('')}
    </div>` : ''}

    <div class="detail-actions">
      <a href="${repo.url}" target="_blank" rel="noopener" class="btn-primary">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        View on GitHub
      </a>
      <button onclick="share('twitter')" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Tweet
      </button>
      <button onclick="share('linkedin')" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </button>
      <button onclick="copyLink()" class="btn-secondary">📋 Copy Link</button>
    </div>

    ${repo.readme_snippet ? `
    <div class="readme-preview">
      <h3 style="font-size:0.9rem;margin-bottom:1rem;color:var(--text-muted)">📄 README Preview</h3>
      <pre>${repo.readme_snippet}</pre>
    </div>` : ''}

    ${related.length ? `
    <div class="related-section">
      <h3>🔗 Related Repositories</h3>
      <div class="repo-grid" style="margin-top:0.5rem">
        ${related.map(r => `
          <div class="repo-card" onclick="window.open('repo.html?id=${r.id}','_self')">
            <div class="repo-card-header">
              <div><strong>${r.full_name.split('/')[1]}</strong></div>
              <span class="velocity-badge ${r.velocity_score>=25?'velocity-hot':'velocity-moderate'}">${r.velocity_score.toFixed(1)}x</span>
            </div>
            <div class="repo-desc">${r.description}</div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
  `;
}

function share(platform) {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  const maps = {
    twitter: `https://twitter.com/intent/tweet?text=${title}&url=${url}`,
    linkedin: `https://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}`
  };
  window.open(maps[platform], '_blank', 'width=600,height=400');
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => alert('✅ Link copied!'));
}

if (!repoId) document.getElementById('repoDetail').innerHTML = '<p>No repo specified. <a href="/">Browse trending repos</a></p>';
else load();

// Background
(function(){const c=document.getElementById('bgCanvas'),x=c.getContext('2d');let w,h,ps=[];function r(){w=c.width=innerWidth;h=c.height=innerHeight}r();addEventListener('resize',r);for(let i=0;i<40;i++)ps.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3});(function d(){x.clearRect(0,0,w,h);const cl=document.body.classList.contains('light')?'120,120,140':'80,100,140';ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=`rgba(${cl},0.12)`;x.fill();for(let j=i+1;j<ps.length;j++){const dx=p.x-ps[j].x,dy=p.y-ps[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<120){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(ps[j].x,ps[j].y);x.strokeStyle=`rgba(${cl},0.025)`;x.lineWidth=.5;x.stroke()}}});requestAnimationFrame(d)})()})();
</script>
</body>
</html>
