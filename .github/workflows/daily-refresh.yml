name: Daily Repo Refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_repos.py
      
      - name: Commit updated data
        run: |
          git config user.name "AI Repo Radar Bot"
          git config user.email "bot@aireporadar.dev"
          git add data/
          git diff --staged --quiet || git commit -m "📡 Daily refresh: $(date +%Y-%m-%d)"
          git push
      
      - name: Build and deploy to Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install wrangler
          npx wrangler pages deploy . --project-name ai-repo-radar --branch main
