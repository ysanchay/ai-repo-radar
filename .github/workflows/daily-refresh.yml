name: Daily Repo Refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_repos.py
      
      - name: Commit updated data
        run: |
          git config user.name "AI Repo Radar Bot"
          git config user.email "bot@aireporadar.dev"
          git add data/
          git diff --staged --quiet || git commit -m "📡 Daily refresh: $(date +%Y-%m-%d)"
          git push
      
      - name: Install wrangler
        run: npm install wrangler
      
      - name: Deploy to Cloudflare (attempt 1)
        id: deploy1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy . --project-name ai-repo-radar --branch main || echo "DEPLOY_FAILED=1" >> $GITHUB_ENV
        continue-on-error: true
      
      - name: Deploy to Cloudflare (attempt 2)
        if: env.DEPLOY_FAILED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          sleep 10
          npx wrangler pages deploy . --project-name ai-repo-radar --branch main
      
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=🚨 *AI Repo Radar Deploy Failed*%0A%0AGitHub Actions deploy step failed on $(date +%Y-%m-%d).%0A%0AAction: Check CF_API_TOKEN and CF_ACCOUNT_ID secrets.%0A%0AServer backup deploy will run at 9:15 AM IST."
